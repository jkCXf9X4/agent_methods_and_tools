# pb.toml — full schema for the product-breakdown standard.
#
# Copy to <breakdown-root>/pb.toml and delete everything that matches the
# default. Mirrors the built-in defaults in pbstd/config.py; that file is
# authoritative if the two ever disagree.

[layout]
# Files treated as index nodes (goal/warning/strict in [nodes]).
index_names = ["README.md", "WORKING-GUIDELINES.md"]
# Subdirectory of the breakdown root holding the flat decision stream.
decisions_dir = "decisions"
# Files inside decisions_dir that are not records.
record_skip = ["TEMPLATE.md", "README.md"]
# First-line marker identifying a generated file (exempt from the node budget).
generated_marker = "GENERATED FILE"
# Top-level directories under the breakdown root to skip when checking nodes.
exclude_dirs = ["tools"]
# Where record `artifacts:` are resolved from; default is the parent of the
# breakdown root. Set relative to the breakdown root if it differs.
# repo_root = ".."

[layers]
# Reading order; also the allowed `layers:` values.
order = ["intent", "product", "architecture", "implementation", "verification", "operation"]
# ID prefix per layer (stable citation labels).
prefixes = { intent = "ID", product = "PD", architecture = "AD", implementation = "IMD", verification = "VD", operation = "OD" }

[records]
# Required body sections, in order.
sections = ["Context", "Decision", "Rationale", "Alternatives Considered", "Consequences", "Verification", "Review Trigger"]
# Headings that must never appear (legacy current-state sections).
legacy_sections = ["Current Choice", "Status", "Layer"]
statuses = ["proposed", "accepted", "superseded", "rejected", "deprecated"]
required_keys = ["id", "title", "date", "status", "layers", "state", "artifacts", "supersedes", "superseded_by", "related"]
# section = [target lines, hard cap]
budgets = { Context = [5, 8], Decision = [4, 6], Rationale = [5, 8] }

[nodes]
# Three size tiers per node kind. At or under goal is silent; over goal →
# `info`; over warning → `warn`; over strict → `HARD` (fails `node-size --strict`).
index_goal = 40
index_warning = 50
index_strict = 75
leaf_goal = 50
leaf_warning = 75
leaf_strict = 100
leaf_min = 10
# Filenames and folders always exempt from the node budget. A bare name (file
# or folder) matches on any path component, so a folder entry exempts that
# folder's whole subtree under the root; a "dir" or "dir/sub" entry with a
# slash pins one exact nested folder.
exempt = ["design-choice-log.md", "traceability-map.md"]
# A node can also exempt itself via front matter: add `pb_exempt: true` to its
# YAML block. Opt-in per file, for genuinely long reference material — the
# default remedy is still trim → link → split.

[registers]
index = "decisions/README.md"
log = "design-choice-log.md"
traceability = "traceability-map.md"
log_title = "Decision Log"
banner = "<!-- GENERATED FILE — do not edit. Regenerate with pb-registers. -->"

[indexes]
# Generated navigation: each index's Contents list is rebuilt from direct-child
# front-matter, so moving a leaf never requires a hand link-sweep. Disable to
# keep indexes fully hand-written (not recommended).
enabled = true
# Heading whose list is regenerated (searched with `## ` prefix).
# section = "Contents"
# Markers bracketing the generated list inside that section.
# start_marker = "<!-- pb:index:start -->"
# end_marker = "<!-- pb:index:end -->"
# Front-matter keys used for the row label and one-line description.
# title_key = "title"
# summary_key = "summary"
# Leaf checks (run by `pb check`): live leaves must carry title/summary
# front-matter and must cite other nodes by ID, never by a markdown path link.
# require_leaf_frontmatter = true
# enforce_id_citations = true
